name: Comprobar Rumbo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis
        run: npm run check
      - name: Comprobar reglas y datos
        run: npm test
      - name: Preparar sitio estático
        run: npm run build
